name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        use_s3: [false, true]
    services:
      database:
        image: postgres:18
        env:
          POSTGRES_DB: site_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d site_db"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE__HOST: localhost
      DATABASE__USER: postgres
      DATABASE__PASSWORD: postgres
      DATABASE__NAME: site_db
      REDIS__HOST: localhost
      REDIS__PASSWORD: dev
      S3__ACCESS_KEY_ID: ci-dummy
      S3__SECRET_ACCESS_KEY: ci-dummy
      S3__BUCKET: bucket
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv tool install copier
      # A service container can't take redis-server arguments, so Redis (with a password) runs here instead.
      - run: docker run -d --network host redis:8.10 redis-server --requirepass "$REDIS__PASSWORD"
      - run: scripts/test-template.sh ${{ matrix.use_s3 }}
